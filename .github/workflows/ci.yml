# Every pull request from the lab runs this. A contribution only merges to
# main if the whole suite passes, and the failure log of a red run is fed back
# to the lab so the models learn from real errors.
#
# The Observable Lab trusts this workflow by its numeric ID
# (LAB_REQUIRED_CI_WORKFLOW_IDS). Keep the file name: renaming it registers a
# new workflow with a new ID.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
