# Every agent PR runs this for real — a contribution only merges to main if
# the whole suite passes. Failure logs are fed back to the lab so the models
# learn from actual runtime errors.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx vitest run
